<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#172925">
  <title>The Newt's Journey</title>
  <style>
    :root{--ink:#182621;--paper:#eee3ca;--ember:#de5637;--water:#315f63}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#172925;color:var(--ink);font-family:Georgia,"Times New Roman",serif;touch-action:none}
    body{display:grid;place-items:center}
    #frame{position:relative;width:100vw;height:100dvh;overflow:hidden;background:var(--paper)}
    canvas{display:block;width:100%;height:100%;cursor:crosshair}
    #sound{position:absolute;z-index:5;top:max(14px,env(safe-area-inset-top));right:16px;width:42px;height:42px;border:1px solid #f4ead090;border-radius:50%;background:#172925c9;color:#f4ead0;font-size:18px;backdrop-filter:blur(5px)}
    #touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:4}
    .pad,.acts{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));pointer-events:auto}
    .pad{left:18px;width:154px;height:154px}.acts{right:18px;width:200px;height:154px}
    .control{position:absolute;width:54px;height:54px;border:1px solid #f7edd4a6;border-radius:42% 58% 51% 49%;background:#172925d9;color:#f7edd4;font:700 22px system-ui;box-shadow:0 5px 18px #10201a66;backdrop-filter:blur(5px)}
    .control:active{transform:scale(.91);background:#bd4d35e6}
    [data-key=left]{left:0;top:51px}[data-key=right]{right:0;top:51px}[data-key=up]{left:50px;top:0}[data-key=down]{left:50px;bottom:0}
    .acts [data-key=space]{right:0;top:2px;width:82px;height:82px;font-size:12px}.acts [data-key=shift]{left:12px;top:12px;width:66px;height:66px;font-size:10px;background:#a53f30dc}.acts [data-key=r]{right:18px;bottom:0;width:66px;height:66px;font-size:9px;background:#316b5cdc}
    @media(pointer:coarse),(max-width:900px){#touch{display:block}}
  </style>
</head>
<body>
<main id="frame">
  <canvas id="game" aria-label="The Newt's Journey, a life-cycle survival game"></canvas>
  <button id="sound" aria-label="Toggle sound">♪</button>
  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button class="control" data-key="left">‹</button><button class="control" data-key="right">›</button>
      <button class="control" data-key="up">⌃</button><button class="control" data-key="down">⌄</button>
    </div>
    <div class="acts">
      <button class="control" data-key="space">ACTION</button>
      <button class="control" data-key="shift">TOXIN</button>
      <button class="control" data-key="r">REGENERATE</button>
    </div>
  </div>
</main>
<script>
(() => {
  'use strict';

  const canvas = document.querySelector('#game');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const STATES = Object.freeze({ MENU:'MENU', EGG:'EGG', LARVA:'LARVA', EFT:'EFT', BOSS:'BOSS', VICTORY:'VICTORY', DEAD:'DEAD' });
  const keys = Object.create(null), taps = Object.create(null);
  let W=1280,H=720,dpr=1,last=0,time=0,state=STATES.MENU,paused=false,muted=false,audio=null;
  let cameraX=0,shake=0,chapterCard=0,chapterTitle='',toast='',toastTime=0;
  let entities=[],particles=[];

  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,n)=>a+(b-a)*n;
  const held=(...names)=>names.some(n=>keys[n]);
  const tapped=(...names)=>names.some(n=>taps[n]);
  const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

  const player={x:180,y:350,vx:0,vy:0,r:24,face:1,toxin:62,lives:3,inv:0,boost:0,sense:0,slime:0,camo:0,regenCooldown:0,regenActive:0,onGround:false,tail:true,step:0};
  const level={length:0,ground:0,progress:0,hatch:0,hatching:false,boss:null};

  function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);level.ground=H-86}
  addEventListener('resize',resize);resize();

  function setInput(name,value){if(value&&!keys[name])taps[name]=true;keys[name]=value;audio?.resume()}
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','shift','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();setInput(k,true);if(k==='p')paused=!paused});
  addEventListener('keyup',e=>setInput(e.key.toLowerCase(),false));
  document.querySelectorAll('[data-key]').forEach(button=>{const map={left:'arrowleft',right:'arrowright',up:'arrowup',down:'arrowdown',space:' ',shift:'shift',r:'r'},k=map[button.dataset.key];button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);setInput(k,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>button.addEventListener(ev,e=>{e.preventDefault();setInput(k,false)}))});
  document.querySelector('#sound').addEventListener('click',()=>{muted=!muted;document.querySelector('#sound').textContent=muted?'×':'♪'});

  function tone(freq=320,duration=.08,type='sine',volume=.04){if(muted)return;audio??=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(38,freq*.7),now+duration);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+duration)}
  function say(text,duration=2){toast=text;toastTime=duration}
  function chapter(text){chapterTitle=text;chapterCard=2.25}
  function addParticle(x,y,color,count=12,speed=100,kind='fleck'){for(let i=0;i<count;i++){const a=rand(0,TAU),s=rand(.15,1)*speed;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.45,1.15),max:1,color,size:rand(1.5,6),kind})}}
  function resetPlayer(x=180,y=H*.52){Object.assign(player,{x,y,vx:0,vy:0,r:24,face:1,toxin:62,inv:0,boost:0,sense:0,slime:0,camo:0,regenCooldown:0,regenActive:0,onGround:false,tail:true,step:0})}

  function go(next){state=next;time=0;cameraX=0;entities=[];particles=[];level.progress=0;level.hatching=false;resetPlayer();
    if(next===STATES.EGG){player.lives=3;level.hatch=0;player.x=W*.5;player.y=H*.48;spawnEgg();chapter('I  ·  BEGINNING')}
    if(next===STATES.LARVA){level.length=6400;player.x=160;player.y=H*.48;spawnLarvaWorld();chapter('II  ·  WATER')}
    if(next===STATES.EFT){level.length=6800;player.x=160;player.y=level.ground;spawnForestWorld();chapter('III  ·  EARTH')}
    if(next===STATES.BOSS){level.length=1600;player.x=180;player.y=level.ground;spawnBoss();chapter('IV  ·  RETURN')}
    tone(470,.2,'triangle',.055)
  }

  function spawnEgg(){for(let i=0;i<8;i++)entities.push({type:'yolk',x:W*.5+rand(-150,150),y:H*.48+rand(-130,130),r:8,phase:rand(0,TAU)})}
  function spawnLarvaWorld(){
    for(let x=500;x<level.length-250;x+=rand(270,440)){const roll=Math.random();entities.push({type:roll<.56?'midge':roll<.78?'sense':'mineral',x,y:rand(130,H-110),r:roll<.56?9:14,phase:rand(0,TAU)})}
    for(let x=900;x<level.length-500;x+=rand(650,950)){const fish=Math.random()<.72;entities.push({type:fish?'fish':'frog',x,y:rand(150,H-125),r:fish?40:46,vx:rand(-55,-25),home:x,phase:rand(0,TAU),stun:0,hit:0})}
    for(let x=720;x<level.length;x+=1100)entities.push({type:'reed-safe',x,y:H-90,r:75});
  }
  function spawnForestWorld(){
    for(let x=430;x<level.length-220;x+=rand(240,410)){const type=Math.random()<.7?'dew':'moss';entities.push({type,x,y:level.ground-rand(20,125),r:12,phase:rand(0,TAU)})}
    for(let x=780;x<level.length-450;x+=rand(580,840)){const type=Math.random()<.7?'needle':'snake';entities.push({type,x,y:type==='needle'?rand(-180,-20):level.ground-2,r:type==='needle'?9:42,vy:type==='needle'?rand(120,190):0,home:x,phase:rand(0,TAU),stun:0,hit:0})}
    for(let x=1000;x<level.length;x+=1350)entities.push({type:'log-safe',x,y:level.ground-20,r:90});
  }
  function spawnBoss(){const boss={type:'boss',x:1260,y:level.ground-36,r:88,hp:80,maxHp:80,mode:'watch',timer:2.4,attack:0,vulnerable:0,stun:0,hit:false};level.boss=boss;entities.push(boss);[470,720,940].forEach(x=>entities.push({type:'beetle',x,y:level.ground-18,r:14,used:false,phase:rand(0,TAU)}))}

  function hurt(amount){if(player.inv>0)return;player.toxin-=amount;player.inv=1.15;shake=8;addParticle(player.x,player.y,'#b53f31',18,150,'ink');tone(75,.2,'sawtooth',.075);if(player.toxin<=0){player.lives--;if(player.lives<=0)go(STATES.DEAD);else{player.toxin=42;player.x=Math.max(100,player.x-300);player.inv=2.5;say('The warning colour dims, then returns.',2)}}}
  function toxinBurst(){if(player.toxin<100)return say('The toxin gland is not fully charged.',1.4);player.toxin=28;player.inv=1.4;shake=5;addParticle(player.x,player.y,'#d95035',48,250,'wash');entities.forEach(e=>{if(distance(player,e)<260)e.stun=3});if(level.boss&&distance(player,level.boss)<290){level.boss.stun=2.2;level.boss.vulnerable=2.2}tone(105,.55,'sawtooth',.09)}
  function regenerate(){if(state!==STATES.BOSS)return say('Regeneration develops in adulthood.',1.5);if(player.regenCooldown>0)return say('Regeneration returns in '+Math.ceil(player.regenCooldown)+' seconds.',1.3);if(player.toxin>74)return say('Regeneration is ready when toxin falls below 75%.',1.4);player.regenCooldown=15;player.regenActive=2.4;player.inv=3;player.tail=false;level.boss.stun=2.5;level.boss.mode='confused';level.boss.timer=2.5;entities.push({type:'decoy',x:player.x-18*player.face,y:player.y+3,r:18,life:3});say('Tail decoy cast. Tissue rebuilding.',2);addParticle(player.x,player.y,'#6fae88',30,120,'wash');tone(240,.55,'triangle',.075)}

  function update(dt){
    if(paused){clearTaps();return}
    time+=dt;shake*=.86;toastTime=Math.max(0,toastTime-dt);chapterCard=Math.max(0,chapterCard-dt);
    player.inv=Math.max(0,player.inv-dt);player.boost=Math.max(0,player.boost-dt);player.sense=Math.max(0,player.sense-dt);player.slime=Math.max(0,player.slime-dt);player.camo=Math.max(0,player.camo-dt);player.regenCooldown=Math.max(0,player.regenCooldown-dt);
    if(player.regenActive>0){player.regenActive-=dt;player.toxin=clamp(player.toxin+18*dt,0,100);if(player.regenActive<=0)player.tail=true}
    if(tapped(' ','enter')&&[STATES.MENU,STATES.VICTORY,STATES.DEAD].includes(state)){go(STATES.EGG);clearTaps();return}
    if(tapped('shift')&&[STATES.LARVA,STATES.EFT,STATES.BOSS].includes(state))toxinBurst();
    if(tapped('r'))regenerate();
    if(state===STATES.EGG)updateEgg(dt);if(state===STATES.LARVA)updateLarva(dt);if(state===STATES.EFT)updateEft(dt);if(state===STATES.BOSS)updateBoss(dt);
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy=p.vy*.97+18*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
    entities.forEach(e=>{if(e.life!==undefined)e.life-=dt});entities=entities.filter(e=>e.life===undefined||e.life>0);clearTaps();
  }
  function clearTaps(){Object.keys(taps).forEach(k=>delete taps[k])}

  function updateEgg(dt){
    const dx=(held('arrowright','d')?1:0)-(held('arrowleft','a')?1:0),dy=(held('arrowdown','s')?1:0)-(held('arrowup','w')?1:0);
    player.x=clamp(player.x+dx*65*dt,W*.5-82,W*.5+82);player.y=clamp(player.y+dy*65*dt,H*.48-92,H*.48+92);level.hatch=Math.max(0,level.hatch-dt*2.3);
    if(tapped(' ')){level.hatch+=7.2;addParticle(player.x+rand(-20,20),player.y+rand(-15,15),'#e9ddba',4,45);tone(180+level.hatch*2,.04,'triangle',.025)}
    entities.forEach(e=>{e.phase+=dt;e.x+=Math.sin(e.phase)*8*dt;if(distance(player,e)<28){e.life=.001;level.hatch+=13;addParticle(e.x,e.y,'#d2a946',10,75,'wash');tone(620,.09)}});
    if(level.hatch>=100&&!level.hatching){level.hatching=true;addParticle(W*.5,H*.48,'#efe3c8',60,230,'paper');tone(680,.35,'triangle',.08);setTimeout(()=>{if(state===STATES.EGG)go(STATES.LARVA)},900)}
  }

  function updateCamera(){const target=clamp(player.x-W*.35,0,Math.max(0,level.length-W));cameraX=lerp(cameraX,target,.075)}
  function updateLarva(dt){
    const dx=(held('arrowright','d')?1:0)-(held('arrowleft','a')?1:0),dy=(held('arrowdown','s')?1:0)-(held('arrowup','w')?1:0),power=player.boost>0?410:245;
    if(dx)player.face=dx;player.vx+=(dx*power-player.vx*2.25)*dt;player.vy+=(dy*power-player.vy*2.15+Math.sin(time*2.4)*9)*dt;
    if(tapped(' ')){player.vx+=player.face*125;addParticle(player.x-25*player.face,player.y,'#d7e6dc',8,55,'bubble');tone(390,.08,'triangle',.035)}
    player.x=clamp(player.x+player.vx*dt,45,level.length-70);player.y=clamp(player.y+player.vy*dt,85,H-72);player.step+=Math.abs(player.vx)*dt*.03;updateCamera();
    entities.forEach(e=>{e.stun=Math.max(0,(e.stun||0)-dt);e.hit=Math.max(0,(e.hit||0)-dt);if(e.type==='fish'||e.type==='frog'){if(e.stun<=0){e.x+=e.vx*dt;e.y+=Math.sin(time*1.8+e.phase)*18*dt;if(Math.abs(e.x-e.home)>210)e.vx*=-1}if(distance(player,e)<player.r+e.r&&e.hit<=0){hurt(e.type==='frog'?25:19);e.hit=1.5}}
      if(['midge','sense','mineral'].includes(e.type)&&distance(player,e)<player.r+e.r){if(e.type==='midge'){player.boost=4;player.inv=2.4;player.toxin=clamp(player.toxin+17,0,100);say('Midge swarm: quickened and untouchable.',1.7)}if(e.type==='sense'){player.sense=7;say('Lateral line: movement travels through water.',1.8)}if(e.type==='mineral'){player.toxin=clamp(player.toxin+24,0,100);say('Minerals absorbed into the skin.',1.5)}e.life=.001;addParticle(e.x,e.y,e.type==='sense'?'#8bbab2':'#d9ad4b',14,90,'wash')}
      if(e.type==='reed-safe'&&distance(player,e)<e.r+20&&player.toxin<48)player.toxin=Math.min(48,player.toxin+7*dt)
    });level.progress=player.x/level.length;if(player.x>level.length-120)go(STATES.EFT)
  }

  function updateEft(dt){
    const dx=(held('arrowright','d')?1:0)-(held('arrowleft','a')?1:0),speed=player.slime>0?310:205;if(dx)player.face=dx;
    player.vx=lerp(player.vx,dx*speed,dt*(player.slime>0?5:8));if(tapped(' ','arrowup','w')&&player.onGround){player.vy=-420;player.onGround=false;tone(280,.08,'triangle',.03)}
    player.vy+=980*dt;player.x=clamp(player.x+player.vx*dt,45,level.length-70);player.y+=player.vy*dt;if(player.y>=level.ground){player.y=level.ground;player.vy=0;player.onGround=true}player.step+=Math.abs(player.vx)*dt*.045;updateCamera();
    entities.forEach(e=>{e.stun=Math.max(0,(e.stun||0)-dt);e.hit=Math.max(0,(e.hit||0)-dt);if(e.type==='needle'){e.y+=e.vy*dt;if(e.y>level.ground){e.y=rand(-180,-30);e.x+=rand(180,420)}}if(e.type==='snake'&&e.stun<=0&&player.camo<=0){const direction=Math.sign(player.x-e.x);if(Math.abs(player.x-e.x)<310)e.x+=direction*58*dt}
      if(['dew','moss'].includes(e.type)&&distance(player,e)<player.r+e.r){if(e.type==='dew'){player.slime=6;player.toxin=clamp(player.toxin+13,0,100);say('Dew slicks the skin. Movement loosens.',1.6)}else{player.camo=7;say('Moss pattern: the body disappears into ground.',1.8)}e.life=.001;addParticle(e.x,e.y,e.type==='dew'?'#a9cac0':'#70865f',15,80,'wash')}
      if(['needle','snake'].includes(e.type)&&distance(player,e)<player.r+e.r&&e.hit<=0){hurt(e.type==='snake'?27:13);e.hit=1.4;if(e.type==='needle')e.y=-100}
      if(e.type==='log-safe'&&distance(player,e)<e.r+25&&player.toxin<50)player.toxin=Math.min(50,player.toxin+6*dt)
    });level.progress=player.x/level.length;if(player.x>level.length-120)go(STATES.BOSS)
  }

  function updateBoss(dt){
    const b=level.boss;if(!b)return;const dx=(held('arrowright','d')?1:0)-(held('arrowleft','a')?1:0);if(dx)player.face=dx;player.vx=lerp(player.vx,dx*220,dt*8);
    if(tapped(' ','arrowup','w')&&player.onGround){if(b.vulnerable>0&&Math.abs(player.x-b.x)<260){const damage=player.boost>0?34:20;b.hp-=damage;b.vulnerable=0;b.stun=1.2;player.vx=-280;shake=9;addParticle(b.x-70,b.y,'#c94c34',25,170,'ink');say('Toxin secretion: '+damage+' damage.',1.2);tone(82,.24,'sawtooth',.09)}else{player.vy=-440;player.onGround=false;tone(280,.08,'triangle',.03)}}
    player.vy+=1000*dt;player.x=clamp(player.x+player.vx*dt,45,level.length-50);player.y+=player.vy*dt;if(player.y>=level.ground){player.y=level.ground;player.vy=0;player.onGround=true}updateCamera();
    b.timer-=dt;b.stun=Math.max(0,b.stun-dt);b.vulnerable=Math.max(0,b.vulnerable-dt);
    if(b.stun<=0&&b.timer<=0){if(b.mode==='watch'||b.mode==='confused'){b.attack=(b.attack+1)%3;b.mode='telegraph';b.timer=b.attack===0?1.15:1.35;say(b.attack===0?'The throat tightens...':b.attack===1?'The body coils...':'The ground begins to tremble...',1)}else if(b.mode==='telegraph'){b.mode='attack';b.timer=b.attack===0?.75:b.attack===1?.65:1.2;b.hit=false;if(b.attack===0)entities.push({type:'tongue',x:b.x-65,y:b.y-30,r:17,vx:-520,life:.85,hit:false});if(b.attack===1){b.startX=b.x;b.targetX=clamp(player.x+80,760,1320)}if(b.attack===2)entities.push({type:'shock',x:b.x-25,y:level.ground,r:12,life:1.45,hit:false});tone(62,.25,'square',.06)}else if(b.mode==='attack'){b.mode='recover';b.timer=2.8;b.vulnerable=2.8;say('The fire-coloured belly is exposed.',1.8)}else if(b.mode==='recover'){b.mode='watch';b.timer=2.2}}
    if(b.mode==='attack'&&b.attack===1){b.x=lerp(b.x,b.targetX,.12);if(!b.hit&&distance(player,b)<player.r+b.r-10){hurt(20);b.hit=true}}if(b.mode==='recover'&&b.attack===1)b.x=lerp(b.x,1260,.08);
    entities.forEach(e=>{if(e.type==='tongue'){e.x+=e.vx*dt;if(!e.hit&&distance(player,e)<player.r+e.r){hurt(17);e.hit=true;e.life=.01}}if(e.type==='shock'){e.r+=220*dt;if(!e.hit&&Math.abs(player.x-e.x)<e.r&&Math.abs(player.x-e.x)>e.r-30&&player.onGround){hurt(14);e.hit=true}}if(e.type==='beetle'&&!e.used&&distance(player,e)<player.r+e.r){e.used=true;player.boost=12;player.toxin=100;say('Toxic beetle: TTX secretion amplified.',1.8);addParticle(e.x,e.y,'#cf7736',18,110,'wash')}});if(b.hp<=0)go(STATES.VICTORY)
  }

  function paper(){ctx.fillStyle='#eee4cc';ctx.fillRect(0,0,W,H);ctx.globalAlpha=.055;for(let i=0;i<Math.ceil(W*H/4200);i++){ctx.fillStyle=i%2?'#5c4935':'#fffaf0';ctx.fillRect((i*83+17)%W,(i*137+31)%H,rand(.5,2.2),rand(.5,2.2))}ctx.globalAlpha=1}
  function watercolor(x,y,rx,ry,color,layers=7){ctx.save();ctx.globalCompositeOperation='multiply';for(let i=0;i<layers;i++){ctx.globalAlpha=.055;ctx.fillStyle=color;ctx.beginPath();const ox=rand(-rx*.07,rx*.07),oy=rand(-ry*.07,ry*.07);for(let j=0;j<=24;j++){const a=j/24*TAU,r=1+Math.sin(j*7.3+i)*.035,px=x+ox+Math.cos(a)*rx*r,py=y+oy+Math.sin(a)*ry*r;j?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.fill()}ctx.restore()}
  function inkPath(draw,width=2,color='#17251f',alpha=.88){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=alpha;ctx.beginPath();draw(ctx);ctx.stroke();ctx.globalAlpha=.22;ctx.translate(.8,-.4);ctx.beginPath();draw(ctx);ctx.stroke();ctx.restore()}
  function hatch(x,y,w,h,spacing=8,color='#17251f'){ctx.save();ctx.strokeStyle=color;ctx.globalAlpha=.12;ctx.lineWidth=1;for(let i=-h;i<w+h;i+=spacing){ctx.beginPath();ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+h,y);ctx.stroke()}ctx.restore()}
  function worldX(x){return x-cameraX}

  function drawPond(close=false){paper();ctx.fillStyle=close?'#244f52':'#315f63';ctx.fillRect(0,0,W,H);watercolor(W*.25,H*.3,W*.42,H*.55,'#224d50',10);watercolor(W*.78,H*.42,W*.5,H*.5,'#577b70',9);ctx.globalAlpha=.1;ctx.fillStyle='#f6edcf';for(let i=0;i<9;i++){ctx.beginPath();ctx.moveTo(i*190-80,0);ctx.lineTo(i*190+40,0);ctx.lineTo(i*190+240,H);ctx.lineTo(i*190+80,H);ctx.fill()}ctx.globalAlpha=1;for(let x=-120-(cameraX*.12%180);x<W+150;x+=180){inkPath(p=>{p.moveTo(x,H+10);p.bezierCurveTo(x+30,H-150,x-25,H-260,x+20,H-380)},5,'#213f39',.65);for(let k=0;k<4;k++){ctx.fillStyle='#496b51';ctx.beginPath();ctx.ellipse(x+Math.sin(k*2)*22,H-90-k*72,34,10,k%2?.45:-.45,0,TAU);ctx.fill()}}ctx.fillStyle='#183932';ctx.fillRect(0,H-45,W,45);hatch(0,H-45,W,45,12,'#d0ba7c')}
  function drawForest(){paper();watercolor(W*.22,H*.36,W*.48,H*.6,'#8d7248',10);watercolor(W*.76,H*.48,W*.52,H*.55,'#506443',10);ctx.fillStyle='#293d31';for(let x=-180-(cameraX*.16%260);x<W+260;x+=260){ctx.beginPath();ctx.moveTo(x,H);ctx.bezierCurveTo(x+42,H-230,x+15,H-470,x+92,-40);ctx.lineTo(x+155,-40);ctx.bezierCurveTo(x+88,H-420,x+122,H-220,x+135,H);ctx.fill()}ctx.fillStyle='#4b5838';ctx.fillRect(0,level.ground+20,W,H-level.ground);for(let x=-60-(cameraX*.55%120);x<W+120;x+=120){ctx.fillStyle=x%240?'#75613d':'#3f5a3b';ctx.beginPath();ctx.ellipse(x,level.ground+25,rand(42,72),rand(9,17),rand(-.5,.5),0,TAU);ctx.fill()}hatch(0,level.ground,W,H-level.ground,11,'#e0c389')}

  function drawLarva(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(player.face*scale,scale);const swim=Math.sin(player.step)*7;ctx.fillStyle='#667d72a0';ctx.beginPath();ctx.moveTo(-18,-5);ctx.bezierCurveTo(-50,-24+swim,-92,-24-swim,-120,-2);ctx.bezierCurveTo(-88,24-swim,-48,25+swim,-17,7);ctx.closePath();ctx.fill();inkPath(p=>{p.moveTo(-18,-5);p.bezierCurveTo(-50,-24+swim,-92,-24-swim,-120,-2);p.bezierCurveTo(-88,24-swim,-48,25+swim,-17,7)},1.6,'#17251f',.72);ctx.fillStyle='#293c35';ctx.beginPath();ctx.ellipse(-2,0,39,13,-.03,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(31,-1,25,17,-.04,0,TAU);ctx.fill();hatch(-31,-10,64,19,6,'#d5b787');for(const side of [-1,1])for(let i=0;i<3;i++){const gy=side*(10+i*6);inkPath(p=>{p.moveTo(17,side*7);p.quadraticCurveTo(25-i*3,side*13,22-i*4,gy)},2.6,'#b84532',.95);for(let j=0;j<5;j++)inkPath(p=>{p.moveTo(22-i*4,gy);p.lineTo(31+j*2-i*3,gy+side*(j-2)*2.2)},.8,'#d06a4d',.8)}ctx.fillStyle='#d9cca7';for(const side of [-1,1]){ctx.beginPath();ctx.arc(41,side*7,3,0,TAU);ctx.fill();ctx.fillStyle='#0d1713';ctx.beginPath();ctx.arc(42,side*7,1.5,0,TAU);ctx.fill();ctx.fillStyle='#d9cca7'}ctx.restore()}
  function drawNewt(x,y,scale=1,adult=false,alpha=1){ctx.save();ctx.translate(x,y);ctx.scale(player.face*scale,scale);ctx.globalAlpha=alpha*(player.inv>0&&Math.floor(time*13)%2?.42:1);const walk=Math.sin(player.step)*5,body=adult?'#17231f':'#1d2924';ctx.strokeStyle=body;ctx.lineCap='round';ctx.lineWidth=adult?20:15;ctx.beginPath();ctx.moveTo(-30,0);ctx.bezierCurveTo(-69,4+walk,-104,24-walk,-135,11);ctx.stroke();ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(-2,0,50,18,-.02,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(39,-2,29,19,-.08,0,TAU);ctx.fill();const limbs=[[-26,8,-39,25,-56,26],[17,9,32,26,51,25],[-22,-8,-37,-22,-53,-20],[22,-9,36,-23,54,-21]];ctx.strokeStyle=body;ctx.lineWidth=7;limbs.forEach((q,index)=>{const lift=(index%2===0?walk:-walk)*.35;ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.quadraticCurveTo(q[2],q[3]+lift,q[4],q[5]+lift);ctx.stroke();ctx.lineWidth=1.8;for(let toe=-1;toe<=1;toe++){ctx.beginPath();ctx.moveTo(q[4],q[5]+lift);ctx.lineTo(q[4]+10,q[5]+lift+toe*5);ctx.stroke()}ctx.lineWidth=7});ctx.fillStyle='#dc4d32';ctx.beginPath();ctx.ellipse(4,12,37,8,0,0,TAU);ctx.fill();ctx.fillStyle='#f07948';for(let i=0;i<(adult?7:4);i++){ctx.beginPath();ctx.arc(-24+i*9,11+Math.sin(i*2)*2,2,0,TAU);ctx.fill()}hatch(-43,-13,82,20,7,'#a99c78');if(adult){ctx.fillStyle='#536257';for(let i=0;i<13;i++){ctx.beginPath();ctx.arc(-37+i*7,-5+Math.sin(i*3)*5,1.4,0,TAU);ctx.fill()}}ctx.fillStyle='#cabf9d';ctx.beginPath();ctx.arc(50,-10,3.3,0,TAU);ctx.fill();ctx.fillStyle='#0b120f';ctx.beginPath();ctx.arc(51,-10,1.7,0,TAU);ctx.fill();if(!player.tail){ctx.strokeStyle='#984636';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-34,1);ctx.lineTo(-47,4);ctx.stroke()}ctx.restore()}

  function drawEntity(e){const x=worldX(e.x),y=e.y;if(x<-180||x>W+180)return;ctx.save();ctx.translate(x,y);if(e.stun>0)ctx.rotate(Math.sin(time*23)*.09);
    if(['yolk','midge','sense','mineral','dew'].includes(e.type)){const colors={yolk:'#d1a542',midge:'#dcc66c',sense:'#8dbdb3',mineral:'#d8784b',dew:'#a9d0c5'};watercolor(0,0,e.r*1.6,e.r*1.6,colors[e.type],4);ctx.fillStyle=colors[e.type];ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);ctx.fill();inkPath(p=>p.arc(0,0,e.r,0,TAU),1,'#17251f',.55)}
    if(e.type==='moss'){ctx.fillStyle='#6c8056';for(let i=0;i<8;i++){ctx.beginPath();ctx.ellipse(Math.sin(i*5)*12,Math.cos(i*3)*7,9,4,i,0,TAU);ctx.fill()}}
    if(e.type==='fish'){ctx.scale(Math.sign(e.vx)||-1,1);ctx.fillStyle=e.stun>0?'#71807b':'#2b4643';ctx.beginPath();ctx.ellipse(0,0,46,22,0,0,TAU);ctx.moveTo(-38,0);ctx.lineTo(-75,-29);ctx.lineTo(-72,30);ctx.closePath();ctx.fill();hatch(-35,-16,60,32,7,'#d7c79d');ctx.fillStyle='#d8c071';ctx.beginPath();ctx.arc(26,-7,3.5,0,TAU);ctx.fill()}
    if(e.type==='frog'){ctx.fillStyle=e.stun>0?'#66776a':'#314d38';ctx.beginPath();ctx.ellipse(0,4,50,31,0,0,TAU);ctx.ellipse(32,-14,29,24,0,0,TAU);ctx.fill();ctx.fillStyle='#d3bd68';ctx.beginPath();ctx.arc(42,-25,7,0,TAU);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(44,-25,3,0,TAU);ctx.fill()}
    if(e.type==='needle')inkPath(p=>{p.moveTo(0,-34);p.quadraticCurveTo(4,0,0,34)},4,'#9a7847',.85);
    if(e.type==='snake'){ctx.strokeStyle=e.stun>0?'#77786b':'#3c4735';ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-46,8);ctx.bezierCurveTo(-22,-23,5,24,27,-3);ctx.bezierCurveTo(38,-15,48,-5,55,-9);ctx.stroke();hatch(-34,-13,75,28,8,'#d8bd7a');ctx.fillStyle='#c9b364';ctx.beginPath();ctx.arc(53,-12,2.4,0,TAU);ctx.fill()}
    if(e.type==='reed-safe'){ctx.globalAlpha=.75;for(let i=-3;i<=3;i++)inkPath(p=>{p.moveTo(i*10,25);p.quadraticCurveTo(i*15,-25,i*8,-90-rand(0,25))},4,'#42604a',.72)}
    if(e.type==='log-safe'){ctx.fillStyle='#594b35';ctx.beginPath();ctx.roundRect(-85,-24,170,48,22);ctx.fill();hatch(-80,-22,160,44,9,'#dbc58f');ctx.fillStyle='#718257';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(-65+i*17,-22+Math.sin(i)*5,8,0,TAU);ctx.fill()}}
    if(e.type==='beetle'&&!e.used){ctx.fillStyle='#ca6b35';ctx.beginPath();ctx.ellipse(0,0,15,11,0,0,TAU);ctx.fill();inkPath(p=>{p.moveTo(0,-10);p.lineTo(0,10);p.moveTo(-14,0);p.lineTo(14,0)},1.3,'#17251f',.8)}
    if(e.type==='decoy'){ctx.globalAlpha=Math.max(0,e.life/3);ctx.strokeStyle='#9c4635';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-25,0);ctx.quadraticCurveTo(0,16,29,-2);ctx.stroke()}
    if(e.type==='tongue'){ctx.strokeStyle='#c96f73';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(150,0);ctx.stroke();ctx.fillStyle='#dc8b8c';ctx.beginPath();ctx.arc(0,0,16,0,TAU);ctx.fill()}
    if(e.type==='shock'){ctx.strokeStyle='#d0b56a';ctx.lineWidth=8;ctx.globalAlpha=Math.max(0,e.life/1.45);ctx.beginPath();ctx.arc(0,0,e.r,Math.PI,TAU);ctx.stroke()}
    if(e.type==='boss')drawBoss(e);ctx.restore()
  }

  function drawBoss(b){ctx.scale(-1,1);const expose=b.vulnerable>0;ctx.fillStyle=expose?'#59633a':'#263e30';ctx.beginPath();ctx.ellipse(0,0,94,62,0,0,TAU);ctx.ellipse(68,-39,59,43,-.06,0,TAU);ctx.fill();ctx.strokeStyle='#263e30';ctx.lineWidth=30;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-55,31);ctx.lineTo(-112,61);ctx.moveTo(47,31);ctx.lineTo(102,61);ctx.stroke();ctx.fillStyle='#d3bb5e';ctx.beginPath();ctx.arc(87,-56,11,0,TAU);ctx.fill();ctx.fillStyle='#101711';ctx.beginPath();ctx.arc(90,-57,5,0,TAU);ctx.fill();if(expose){ctx.fillStyle='#d7c36b';ctx.beginPath();ctx.ellipse(3,31,55,20,0,0,TAU);ctx.fill()}hatch(-72,-48,126,85,10,'#c8b77b')}

  function drawHUD(){if([STATES.MENU,STATES.VICTORY,STATES.DEAD].includes(state))return;ctx.save();ctx.fillStyle='#efe5ceeb';ctx.beginPath();ctx.moveTo(20,17);ctx.lineTo(Math.min(442,W-62),21);ctx.lineTo(Math.min(430,W-74),112);ctx.lineTo(25,106);ctx.closePath();ctx.fill();ctx.strokeStyle='#1a2822';ctx.lineWidth=1.5;ctx.stroke();const labels={[STATES.EGG]:'I · EGG',[STATES.LARVA]:'II · AQUATIC LARVA',[STATES.EFT]:'III · JUVENILE EFT',[STATES.BOSS]:'IV · ADULT'};ctx.fillStyle='#1a2822';ctx.font='700 18px Georgia';ctx.fillText(labels[state],38,47);ctx.font='11px system-ui';ctx.fillText('TOXIN / VITALITY',38,69);ctx.fillStyle='#c9bea5';ctx.fillRect(38,79,248,10);ctx.fillStyle='#c84b33';ctx.fillRect(38,79,248*clamp(player.toxin/100,0,1),10);ctx.fillStyle='#1a2822';ctx.font='700 11px system-ui';ctx.fillText(Math.ceil(player.toxin)+'%',298,88);ctx.fillText('● '.repeat(player.lives),38,101);
    if(state===STATES.EGG)drawProgress(level.hatch/100,'HATCH');else if(state===STATES.BOSS)drawProgress(level.boss.hp/level.boss.maxHp,'BULLFROG');else drawProgress(level.progress,'JOURNEY');
    if(state===STATES.BOSS){ctx.font='11px system-ui';ctx.fillText(player.regenCooldown>0?'REGENERATE  '+Math.ceil(player.regenCooldown)+'s':'REGENERATE  READY',Math.min(318,W-180),103)}ctx.restore()}
  function drawProgress(value,label){const w=Math.min(330,W*.3),x=W-w-28;ctx.fillStyle='#efe5cedd';ctx.fillRect(x,23,w,34);ctx.fillStyle='#1b2923';ctx.font='700 10px system-ui';ctx.fillText(label,x+12,44);ctx.fillStyle='#c9bea5';ctx.fillRect(x+74,36,w-88,8);ctx.fillStyle='#365d55';ctx.fillRect(x+74,36,(w-88)*clamp(value,0,1),8)}
  function centered(text,y,size,color='#17251f'){ctx.textAlign='center';ctx.fillStyle=color;ctx.font='700 '+size+'px Georgia';ctx.fillText(text,W/2,y);ctx.textAlign='left'}

  function draw(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));if(state===STATES.MENU)drawMenu();else if(state===STATES.EGG)drawEggScene();else if(state===STATES.LARVA){drawPond();entities.forEach(drawEntity);drawLarva(worldX(player.x),player.y,.82);drawParticles()}else if(state===STATES.EFT){drawForest();entities.forEach(drawEntity);drawNewt(worldX(player.x),player.y,.75,false,player.camo>0?.3:1);drawParticles()}else if(state===STATES.BOSS){drawForest();entities.forEach(drawEntity);drawNewt(worldX(player.x),player.y,.92,true);drawParticles()}else drawEnding();drawHUD();if(toastTime>0)drawToast();if(chapterCard>0)drawChapter();if(paused){ctx.fillStyle='#17251fbb';ctx.fillRect(0,0,W,H);centered('PAUSED',H*.48,44,'#efe5ce')}ctx.restore()}
  function drawMenu(){paper();watercolor(W*.25,H*.45,W*.52,H*.65,'#466c66',12);watercolor(W*.82,H*.55,W*.42,H*.55,'#9c7647',10);ctx.save();ctx.translate(W*.5,H*.57);drawNewt(0,0,Math.min(W/900,1.2),true);ctx.restore();centered("THE NEWT'S",H*.20,clamp(W*.042,31,56),'#293d36');centered('JOURNEY',H*.31,clamp(W*.075,54,96),'#b74932');centered('A natural history in four acts',H*.39,18,'#293d36');centered('Press SPACE or tap ACTION',H*.78,20,'#293d36');ctx.textAlign='center';ctx.fillStyle='#4f5d51';ctx.font='13px system-ui';ctx.fillText('MOVE  arrows / WASD     ACTION  space     TOXIN  shift     REGENERATE  R',W/2,H*.84);ctx.textAlign='left'}
  function drawEggScene(){drawPond(true);ctx.fillStyle='#3f684c';ctx.beginPath();ctx.ellipse(W*.5,H*.64,290,58,-.08,0,TAU);ctx.fill();watercolor(W*.5,H*.48,88,108,'#e8dfbd',9);ctx.fillStyle='#e8dfbd66';ctx.strokeStyle='#d8d0b2';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(W*.5,H*.48,78,99,0,0,TAU);ctx.fill();ctx.stroke();ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.sin(time*3)*.15);ctx.fillStyle='#293b34';ctx.beginPath();ctx.ellipse(0,0,17,31,.5,0,TAU);ctx.fill();ctx.strokeStyle='#b94632';ctx.lineWidth=3;for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(8,side*5);ctx.lineTo(20,side*18);ctx.stroke()}ctx.restore();entities.forEach(drawEntity);drawParticles();centered('Move within the egg. Gather yolk. Tap ACTION to break free.',H-45,15,'#efe5ce')}
  function drawParticles(){particles.forEach(p=>{const x=worldX(p.x);ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;if(p.kind==='wash'){ctx.globalCompositeOperation='multiply';ctx.globalAlpha*=.25}ctx.beginPath();if(p.kind==='paper')ctx.rect(x,p.y,p.size,p.size*.65);else ctx.arc(x,p.y,p.size,0,TAU);ctx.fill();ctx.restore()})}
  function drawToast(){ctx.save();ctx.font='14px Georgia';const width=Math.min(ctx.measureText(toast).width+52,W-38),x=(W-width)/2,y=H*.145;ctx.fillStyle='#17251fe8';ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x+width-8,y);ctx.lineTo(x+width,y+42);ctx.lineTo(x+7,y+46);ctx.closePath();ctx.fill();centered(toast,y+29,14,'#f1e7cf');ctx.restore()}
  function drawChapter(){ctx.save();ctx.globalAlpha=clamp(chapterCard/.5,0,1);ctx.fillStyle='#17251f';ctx.fillRect(0,0,W,H);centered(chapterTitle,H*.46,clamp(W*.045,34,62),'#eee3ca');ctx.strokeStyle='#b94c34';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.38,H*.52);ctx.lineTo(W*.62,H*.52);ctx.stroke();ctx.restore()}
  function drawEnding(){paper();watercolor(W*.5,H*.52,W*.58,H*.55,state===STATES.VICTORY?'#58725d':'#786452',12);ctx.fillStyle='#17251faa';ctx.fillRect(0,0,W,H);centered(state===STATES.VICTORY?'SURVIVED':'THE POND KEEPS MOVING',H*.36,clamp(W*.06,42,82),'#eee3ca');centered(state===STATES.VICTORY?'Egg. Larva. Eft. Adult. The cycle continues.':'Evolution offers no checkpoints. This game does.',H*.48,18,'#eee3ca');centered('Press SPACE or tap ACTION to begin again',H*.64,20,'#d7c9a9')}

  function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
