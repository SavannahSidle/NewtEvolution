<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#091d24">
<title>The Newt's Journey</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06151a;color:#fff;font-family:Georgia,serif;touch-action:none}body{display:grid;place-items:center}
  #wrap{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#0b2830}
  canvas{display:block;width:100%;height:100%;image-rendering:auto}
  #touch{position:absolute;inset:0;pointer-events:none;display:none}.pad,.actions{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));pointer-events:auto}.pad{left:18px;width:145px;height:145px}.actions{right:18px;width:170px;height:145px}
  button.ctrl{position:absolute;border:1px solid #ffffff4d;background:#08262db8;color:white;border-radius:50%;font:700 24px system-ui;width:52px;height:52px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}button.ctrl:active{background:#ef6b48cc;transform:scale(.94)}
  [data-k=left]{left:0;top:48px}[data-k=right]{right:0;top:48px}[data-k=up]{left:47px;top:0}[data-k=down]{left:47px;bottom:0}.actions [data-k=space]{right:0;top:6px;width:76px;height:76px;font-size:13px}.actions [data-k=shift]{left:0;bottom:0;width:66px;height:66px;font-size:11px;background:#c63f35b8}.actions [data-k=r]{right:8px;bottom:0;width:62px;height:62px;font-size:9px;background:#32715fc7}
  #mute{position:absolute;right:14px;top:max(12px,env(safe-area-inset-top));z-index:4;border:0;border-radius:999px;background:#071a20a8;color:white;padding:8px 11px;font-size:16px;pointer-events:auto}
  @media(pointer:coarse),(max-width:800px){#touch{display:block}}
</style>
</head>
<body><div id="wrap"><canvas id="game" aria-label="The Newt's Journey game"></canvas><button id="mute" aria-label="Toggle sound">♪</button><div id="touch"><div class="pad"><button class="ctrl" data-k="left">‹</button><button class="ctrl" data-k="right">›</button><button class="ctrl" data-k="up">⌃</button><button class="ctrl" data-k="down">⌄</button></div><div class="actions"><button class="ctrl" data-k="space">ACTION</button><button class="ctrl" data-k="shift">TOXIN</button><button class="ctrl" data-k="r">REGEN</button></div></div></div>
<script>
(()=>{'use strict';
const C=document.querySelector('#game'),X=C.getContext('2d');let W=1280,H=720,D=1,last=0,shake=0,muted=false;
const S={MENU:'MENU',EGG:'STAGE_1_EGG',LARVA:'STAGE_2_LARVA',EFT:'STAGE_3_EFT',BOSS:'STAGE_4_BOSS',VICTORY:'VICTORY',GAMEOVER:'GAME_OVER'};
const key={},pressed={};let state=S.MENU,t=0,score=0,stageTime=0,particles=[],entities=[],messages=[],audio;
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,n)=>a+(b-a)*n,hit=(a,b)=>Math.abs(a.x-b.x)<(a.r||20)+(b.r||20)&&Math.abs(a.y-b.y)<(a.r||20)+(b.r||20);
const player={x:220,y:360,vx:0,vy:0,r:23,toxin:55,lives:3,inv:0,power:0,boost:0,camouflage:0,slime:0,onGround:false,face:1,tail:true,regen:0};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function sound(f=300,d=.07,type='sine',v=.04){if(muted)return;audio??=new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*.65),audio.currentTime+d);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function input(k,v){if(v&&!key[k])pressed[k]=true;key[k]=v;if(v)audio?.resume()}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k))e.preventDefault();input(k,true)});addEventListener('keyup',e=>input(e.key.toLowerCase(),false));
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k==='space'?' ':b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input(k,true)});for(const ev of ['pointerup','pointercancel'])b.addEventListener(ev,e=>{e.preventDefault();input(k,false)})});
document.querySelector('#mute').onclick=()=>{muted=!muted;document.querySelector('#mute').textContent=muted?'×':'♪'};
const down=(...a)=>a.some(k=>key[k]),tap=(...a)=>a.some(k=>pressed[k]);
function resetPlayer(x=180,y=H*.55){Object.assign(player,{x,y,vx:0,vy:0,toxin:55,inv:0,power:0,boost:0,camouflage:0,slime:0,onGround:false,face:1,tail:true,regen:0})}
function go(s){state=s;t=stageTime=0;entities=[];particles=[];messages=[];resetPlayer();if(s===S.EGG){player.x=W*.5;player.y=H*.48;player.hatch=0;player.nutrients=0;player.hatching=false;player.lives=3}if(s===S.LARVA)spawnLarva();if(s===S.EFT)spawnEft();if(s===S.BOSS)spawnBoss();sound(520,.18,'triangle',.06)}
function burst(x,y,c,n=16,sp=130){for(let i=0;i<n;i++){let a=R(0,Math.PI*2),q=R(.25,1);particles.push({x,y,vx:Math.cos(a)*sp*q,vy:Math.sin(a)*sp*q,life:R(.35,.9),max:1,c,r:R(2,7)})}}
function note(s,d=2){messages.push({s,d})}
function damage(n=18){if(player.inv>0)return;player.toxin-=n;player.inv=1;shake=10;burst(player.x,player.y,'#ff7858',14);sound(90,.2,'sawtooth',.08);if(player.toxin<=0){player.lives--;if(player.lives<=0)go(S.GAMEOVER);else{player.toxin=40;player.x=150;player.y=H*.45;note('A narrow escape. Toxicity restored.')}}}
function toxinBurst(){if(player.toxin<100)return note('Toxin burst needs a full gauge.',1.2);player.toxin=25;player.power=1.15;shake=6;burst(player.x,player.y,'#ff5b3a',44,240);entities.forEach(e=>{if(Math.hypot(e.x-player.x,e.y-player.y)<220)e.stun=3});sound(110,.5,'sawtooth',.1)}
function spawnLarva(){for(let i=0;i<8;i++)entities.push({type:'midge',x:W+R(0,W*2.4),y:R(110,H-100),r:8});for(let i=0;i<4;i++)entities.push({type:'fish',x:W+R(500,W*3),y:R(140,H-100),r:35,v:R(70,120)});for(let i=0;i<3;i++)entities.push({type:'sense',x:W+R(200,W*2.5),y:R(100,H-100),r:15});}
function spawnEft(){for(let i=0;i<10;i++)entities.push({type:i%4?'dew':'camo',x:W+R(0,W*3),y:H-98-R(0,130),r:12});for(let i=0;i<7;i++)entities.push({type:i%3?'needle':'snake',x:W+R(450,W*3.4),y:i%3?R(-200,0):H-82,r:i%3?10:36,vy:i%3?R(130,200):0});}
function spawnBoss(){entities.push({type:'boss',x:W*.79,y:H-130,r:75,hp:65,max:65,phase:0,cool:2.8,stun:0,vulnerable:0});for(let i=0;i<3;i++)entities.push({type:'beetle',x:W*.28+i*W*.15,y:H-100,r:13,used:false});}
function update(dt){t+=dt;stageTime+=dt;player.inv=Math.max(0,player.inv-dt);player.power=Math.max(0,player.power-dt);player.boost=Math.max(0,player.boost-dt);player.camouflage=Math.max(0,player.camouflage-dt);player.slime=Math.max(0,player.slime-dt);player.regen=Math.max(0,player.regen-dt);shake*=.88;
 if(tap('enter',' ')){if(state===S.MENU||state===S.GAMEOVER||state===S.VICTORY)return go(S.EGG)}
 if(state===S.EGG)updateEgg(dt);if(state===S.LARVA)updateLarva(dt);if(state===S.EFT)updateEft(dt);if(state===S.BOSS)updateBoss(dt);
 if(tap('shift')&&![S.MENU,S.EGG,S.VICTORY,S.GAMEOVER].includes(state))toxinBurst();if(tap('r')&&state===S.BOSS)regenerate();
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=25*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);messages.forEach(m=>m.d-=dt);messages=messages.filter(m=>m.d>0);for(const k in pressed)delete pressed[k];}
function updateEgg(dt){player.hatch=Math.max(0,player.hatch-dt*5);if(tap(' ')){player.hatch+=8;burst(player.x+R(-30,30),player.y+R(-40,40),'#e5f8c6',3,45);sound(220+player.hatch*2,.035,'triangle',.025)}if(Math.random()<dt*2)entities.push({type:'nutrient',x:R(W*.2,W*.8),y:-20,r:8,vy:R(35,65)});entities.forEach(e=>{e.x+=(player.x-e.x)*dt*.28;e.y+=e.vy*dt;if(Math.hypot(e.x-player.x,e.y-player.y)<85){player.hatch+=14;player.nutrients++;e.dead=true;burst(e.x,e.y,'#ffe47c',8);sound(700,.08)}});entities=entities.filter(e=>!e.dead&&e.y<H+30);if(player.hatch>=100&&!player.hatching){player.hatching=true;burst(player.x,player.y,'#f5f1cf',55,230);note('HATCHED! Yolk energy converted to speed.');setTimeout(()=>{if(state===S.EGG)go(S.LARVA)},650)}}
function regenerate(){if(player.regen>0)return note(`Regeneration ready in ${Math.ceil(player.regen)}s`,1.2);if(player.toxin>55)return note('Regenerate is available when toxicity falls below 55%.',1.4);player.regen=16;player.inv=3;player.toxin=clamp(player.toxin+38,0,100);let b=entities.find(e=>e.type==='boss');if(b)b.stun=2.5;burst(player.x,player.y,'#83e0b4',32,150);note('Regeneration active: healing and decoy deployed');sound(260,.5,'triangle',.08)}
function moveScroll(dt,speed){let mv=(down('arrowright','d')?1:0)-(down('arrowleft','a')?1:0);player.face=mv||player.face;return mv*speed}
function updateLarva(dt){let thrust=player.boost?360:210;let ax=((down('arrowright','d')?1:0)-(down('arrowleft','a')?1:0))*thrust,ay=((down('arrowdown','s')?1:0)-(down('arrowup','w')?1:0))*thrust;if(tap(' ')){player.vx+=player.face*170;burst(player.x-15*player.face,player.y,'#bceeff',8,65);sound(440,.08)}player.vx+=(ax-player.vx*1.7)*dt;player.vy+=(ay-player.vy*1.7+18*Math.sin(t*2))*dt;player.x=clamp(player.x+player.vx*dt,35,W*.72);player.y=clamp(player.y+player.vy*dt,70,H-45);let scroll=moveScroll(dt,125);entities.forEach(e=>{e.stun=Math.max(0,(e.stun||0)-dt);e.x-=scroll*dt;if(e.type==='fish'&&!e.stun){e.x-=e.v*dt;e.y+=Math.sin(t*2+e.x)*24*dt}if(hit(player,e)){if(e.type==='midge'){player.toxin=clamp(player.toxin+18,0,100);player.boost=3.5;player.inv=3.5;e.dead=true;note('Midge swarm feast: speed + invulnerability');burst(e.x,e.y,'#ffd76e',12)}else if(e.type==='sense'){player.power=6;e.dead=true;note('Lateral line sense: predators revealed');burst(e.x,e.y,'#69ecff',18)}else if(e.type==='fish')damage(24)}});entities=entities.filter(e=>!e.dead&&e.x>-180&&e.x<W+300);if(Math.random()<dt*1.2)entities.push({type:'midge',x:W+30,y:R(100,H-80),r:8});if(Math.random()<dt*.22)entities.push({type:'fish',x:W+70,y:R(120,H-90),r:35,v:R(65,130)});if(stageTime>48)go(S.EFT)}
function updateEft(dt){let floor=H-72,speed=player.slime?300:185,mv=(down('arrowright','d')?1:0)-(down('arrowleft','a')?1:0);player.vx=lerp(player.vx,mv*speed,dt*(player.slime?5:9));if(mv)player.face=mv;if((tap(' ','arrowup','w'))&&player.onGround){player.vy=-430;player.onGround=false;sound(310,.08)}player.vy+=1000*dt;player.x=clamp(player.x+player.vx*dt,30,W*.68);player.y+=player.vy*dt;if(player.y>=floor){player.y=floor;player.vy=0;player.onGround=true}let scroll=moveScroll(dt,105);entities.forEach(e=>{e.stun=Math.max(0,(e.stun||0)-dt);e.x-=scroll*dt;if(e.type==='needle')e.y+=e.vy*dt;if(e.type==='snake'&&!e.stun&&player.camouflage<=0)e.x-=45*dt;if(hit(player,e)){if(e.type==='dew'){player.slime=5;player.toxin=clamp(player.toxin+12,0,100);e.dead=true;note('Moisture coating: low-friction sprint');burst(e.x,e.y,'#9eeaff',12)}else if(e.type==='camo'){player.camouflage=6;e.dead=true;note('Moss camouflage: snakes cannot see you');burst(e.x,e.y,'#91d06b',15)}else if(e.type==='needle'||e.type==='snake'){damage(e.type==='snake'?30:14);e.dead=e.type==='needle'}}});entities=entities.filter(e=>!e.dead&&e.x>-180&&e.x<W+300&&e.y<H+30);if(Math.random()<dt*.8)entities.push({type:Math.random()<.75?'dew':'camo',x:W+25,y:floor-R(0,110),r:12});if(Math.random()<dt*.3)entities.push({type:Math.random()<.65?'needle':'snake',x:W+50,y:Math.random()<.65?R(-120,-10):floor-5,r:22,vy:R(150,230)});if(stageTime>48)go(S.BOSS)}
function updateBoss(dt){let b=entities.find(e=>e.type==='boss');if(!b)return;let floor=H-72,mv=(down('arrowright','d')?1:0)-(down('arrowleft','a')?1:0);player.vx=lerp(player.vx,mv*225,dt*9);if(mv)player.face=mv;if((tap(' ','arrowup','w'))&&player.onGround){if(b.vulnerable>0&&Math.abs(player.x-b.x)<260){b.hp-=player.boost?26:16;b.vulnerable=0;b.stun=1.1;player.vx=player.face*300;burst(b.x-55,b.y,'#ff633f',28,190);shake=11;sound(75,.25,'sawtooth',.12)}else{player.vy=-455;sound(310,.08)}}player.vy+=1050*dt;player.x=clamp(player.x+player.vx*dt,28,W-30);player.y+=player.vy*dt;if(player.y>=floor){player.y=floor;player.vy=0;player.onGround=true}b.cool-=dt;b.vulnerable=Math.max(0,b.vulnerable-dt);b.stun=Math.max(0,b.stun-dt);if(b.cool<=0&&b.stun<=0){b.phase=(b.phase+1)%3;b.cool=R(3.2,4.1);if(b.phase===0){note('Tongue lash!',.8);entities.push({type:'tongue',x:b.x-70,y:b.y-18,r:16,vx:-390,life:1.25})}if(b.phase===1){note('Jump the shockwave!',1);shake=9;entities.push({type:'shock',x:b.x-25,y:floor,r:10,life:1.7,hit:false});sound(55,.3,'square',.08)}if(b.phase===2){b.vulnerable=3.2;note('Belly exposed! Get close and use ACTION.',2)}}entities.forEach(e=>{if(e.type==='tongue'){e.x+=e.vx*dt;e.life-=dt;if(hit(player,e)){damage(18);e.life=0}}if(e.type==='shock'){e.r+=205*dt;e.life-=dt;if(!e.hit&&Math.abs(player.x-e.x)<e.r&&Math.abs(player.x-e.x)>e.r-28&&player.onGround){damage(15);e.hit=true}}if(e.type==='beetle'&&!e.used&&hit(player,e)){e.used=true;player.boost=10;player.toxin=100;note('TTX gland supercharged!');burst(e.x,e.y,'#ff9f32',22)}});entities=entities.filter(e=>e.type==='boss'||e.type==='beetle'&&!e.used||(e.life??1)>0);if(b.hp<=0)go(S.VICTORY)}
function bgAquatic(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2c8791');g.addColorStop(.55,'#155564');g.addColorStop(1,'#092d39');X.fillStyle=g;X.fillRect(0,0,W,H);X.globalAlpha=.18;for(let i=0;i<8;i++){X.fillStyle='#d9ffff';X.beginPath();X.moveTo(i*220-70,0);X.lineTo(i*220+90,H);X.lineTo(i*220+180,H);X.lineTo(i*220+20,0);X.fill()}X.globalAlpha=1;for(let i=0;i<16;i++){let x=(i*91-t*12)%(W+100),h=R(60,150);X.strokeStyle=i%2?'#2d7b62':'#447f52';X.lineWidth=6;X.beginPath();X.moveTo(x,H);X.quadraticCurveTo(x+30,H-h/2,x+Math.sin(t+i)*15,H-h);X.stroke()}X.fillStyle='#112f2e';X.fillRect(0,H-28,W,28)}
function bgForest(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#d7a75d');g.addColorStop(.45,'#6a7444');g.addColorStop(1,'#18392f');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#253d2f';for(let i=0;i<9;i++){let x=(i*190-t*14)%(W+300)-100;X.beginPath();X.moveTo(x,H-60);X.lineTo(x+55,80);X.lineTo(x+95,H-60);X.fill()}X.fillStyle='#30563a';X.fillRect(0,H-72,W,72);for(let i=0;i<24;i++){X.fillStyle=i%3?'#4f7042':'#8f5e3e';X.beginPath();X.ellipse((i*83-t*40)%(W+90),H-55,R(20,48),R(5,12),R(-1,1),0,7);X.fill()}}
function drawNewt(x,y,scale=1,adult=false,alpha=1){X.save();X.translate(x,y);let s=scale*(adult?1:.78);X.scale(player.face*s,s);X.globalAlpha=alpha*(player.inv>0&&Math.floor(t*14)%2?.45:1);let body=adult?'#1d2924':'#202923',edge=adult?'#35443a':'#313d34';X.lineCap='round';X.strokeStyle=body;X.lineWidth=15;X.beginPath();X.moveTo(-25,1);X.bezierCurveTo(-58,9,-76,22,-99,9);X.stroke();X.fillStyle=body;X.beginPath();X.ellipse(-2,0,40,16,-.03,0,7);X.fill();X.fillStyle=edge;X.beginPath();X.ellipse(31,-2,23,16,-.08,0,7);X.fill();X.strokeStyle=body;X.lineWidth=6;for(const q of [[-19,8,-30,23,-42,26],[12,9,22,24,36,25],[-16,-7,-28,-18,-38,-17],[15,-8,26,-19,38,-17]]){X.beginPath();X.moveTo(q[0],q[1]);X.quadraticCurveTo(q[2],q[3],q[4],q[5]);X.stroke();X.lineWidth=2;for(let j=-1;j<=1;j++){X.beginPath();X.moveTo(q[4],q[5]);X.lineTo(q[4]+8,q[5]+j*5);X.stroke()}X.lineWidth=6}X.fillStyle='#ec5134';X.beginPath();X.ellipse(2,10,29,7,0,0,7);X.fill();X.fillStyle='#ff7a43';for(let i=0;i<(adult?5:3);i++){X.beginPath();X.arc(-17+i*10,10+Math.sin(i)*2,2.2,0,7);X.fill()}if(adult){X.fillStyle='#536158';for(let i=0;i<12;i++){X.beginPath();X.arc(-29+i*6,-5+Math.sin(i*2.7)*5,1.4,0,7);X.fill()}}X.fillStyle='#d6c99e';X.beginPath();X.arc(39,-8,3,0,7);X.fill();X.fillStyle='#070b09';X.beginPath();X.arc(40,-8,1.7,0,7);X.fill();X.restore()}
function drawLarva(){X.save();X.translate(player.x,player.y);X.scale(player.face,1);let wave=Math.sin(t*9)*4;X.fillStyle='#647b72aa';X.beginPath();X.moveTo(-17,-3);X.quadraticCurveTo(-52,-20+wave,-88,-4);X.quadraticCurveTo(-53,25+wave,-17,6);X.closePath();X.fill();X.fillStyle='#293b36';X.beginPath();X.ellipse(-3,0,34,12,0,0,7);X.fill();X.beginPath();X.ellipse(27,-1,20,14,0,0,7);X.fill();X.strokeStyle='#db4f38';X.lineCap='round';for(let s of [-1,1])for(let i=0;i<3;i++){let gy=s*(9+i*5);X.lineWidth=3;X.beginPath();X.moveTo(16,s*7);X.lineTo(22-i*3,gy);X.stroke();X.lineWidth=1;for(let j=0;j<4;j++){X.beginPath();X.moveTo(21-i*3,gy);X.lineTo(29-i*3+j*2,gy+s*(j-2)*2);X.stroke()}}X.strokeStyle='#334941';X.lineWidth=3;for(let s of [-1,1]){X.beginPath();X.moveTo(1,s*7);X.lineTo(-8,s*18);X.lineTo(-17,s*20);X.stroke()}X.fillStyle='#d9d0a9';for(let s of [-1,1]){X.beginPath();X.arc(34,s*6,2.5,0,7);X.fill()}X.restore()}
function entity(e){X.save();X.translate(e.x,e.y);if(e.stun)X.rotate(Math.sin(t*24)*.2);if(e.type==='nutrient'||e.type==='sense'||e.type==='dew'){X.fillStyle=e.type==='sense'?'#69ecff':e.type==='dew'?'#bff6ff':'#ffe88a';X.shadowBlur=18;X.shadowColor=X.fillStyle;X.beginPath();X.arc(0,0,e.r,0,7);X.fill()}if(e.type==='midge'){X.fillStyle='#ffe98f';for(let i=0;i<5;i++){X.beginPath();X.arc(Math.sin(i*8)*12,Math.cos(i*6)*10,3,0,7);X.fill()}}if(e.type==='fish'){X.fillStyle=e.stun?'#a0bcc0':'#334f55';X.beginPath();X.ellipse(0,0,38,20,0,0,7);X.moveTo(30,0);X.lineTo(60,-25);X.lineTo(58,25);X.fill();X.fillStyle='#f8cc68';X.beginPath();X.arc(-18,-5,4,0,7);X.fill()}if(e.type==='camo'){X.fillStyle='#96c85a';X.beginPath();X.moveTo(0,-17);X.quadraticCurveTo(28,-8,0,18);X.quadraticCurveTo(-28,-8,0,-17);X.fill()}if(e.type==='needle'){X.strokeStyle='#d3aa6c';X.lineWidth=5;X.beginPath();X.moveTo(0,-28);X.lineTo(0,28);X.stroke()}if(e.type==='snake'){X.strokeStyle=e.stun?'#999':'#514b33';X.lineWidth=16;X.lineCap='round';X.beginPath();X.moveTo(-35,8);X.quadraticCurveTo(-10,-20,15,5);X.quadraticCurveTo(30,18,42,-2);X.stroke();X.fillStyle='#d6c57c';X.beginPath();X.arc(41,-3,2,0,7);X.fill()}if(e.type==='beetle'){X.fillStyle='#ff7a2e';X.beginPath();X.ellipse(0,0,13,10,0,0,7);X.fill();X.strokeStyle='#29221b';X.lineWidth=3;X.beginPath();X.moveTo(0,-9);X.lineTo(0,9);X.stroke()}if(e.type==='tongue'){X.strokeStyle='#ee7f85';X.lineWidth=9;X.beginPath();X.moveTo(0,0);X.lineTo(120,0);X.stroke();X.fillStyle='#ef9699';X.beginPath();X.arc(0,0,17,0,7);X.fill()}if(e.type==='shock'){X.strokeStyle='#e7c97a';X.lineWidth=10;X.globalAlpha=Math.max(0,e.life/1.5);X.beginPath();X.arc(0,0,e.r,Math.PI,Math.PI*2);X.stroke()}if(e.type==='boss'){X.scale(-1,1);X.fillStyle=e.vulnerable?'#807a38':'#38562e';X.beginPath();X.ellipse(0,0,78,55,0,0,7);X.fill();X.beginPath();X.ellipse(55,-35,52,39,-.1,0,7);X.fill();X.fillStyle='#d7b638';X.beginPath();X.arc(73,-51,10,0,7);X.fill();X.fillStyle='#111';X.beginPath();X.arc(75,-52,5,0,7);X.fill();X.strokeStyle='#38562e';X.lineWidth=24;X.lineCap='round';X.beginPath();X.moveTo(-45,32);X.lineTo(-90,58);X.moveTo(40,32);X.lineTo(83,58);X.stroke()}X.restore()}
function hud(title,sub){X.fillStyle='#071b21cc';X.fillRect(18,18,Math.min(420,W-88),90);X.fillStyle='#f9efd5';X.font='700 18px Georgia';X.fillText(title,34,46);X.font='13px system-ui';X.fillStyle='#c7ddd6';X.fillText(sub,34,68);X.fillStyle='#263d3d';round(34,79,260,13,7);X.fill();let g=X.createLinearGradient(34,0,294,0);g.addColorStop(0,'#e85837');g.addColorStop(1,'#ffb13b');X.fillStyle=g;round(34,79,260*clamp(player.toxin/100,0,1),13,7);X.fill();X.fillStyle='#fff';X.font='700 10px system-ui';X.fillText(`TOXIN ${Math.ceil(player.toxin)}%`,304,90);X.fillText('●'.repeat(player.lives),34,103)}
function round(x,y,w,h,r){X.beginPath();X.roundRect(x,y,Math.max(0,w),h,r)}
function center(a,b,y,size=20){X.textAlign='center';X.fillStyle=a;X.font=`700 ${size}px Georgia`;X.fillText(b,W/2,y);X.textAlign='left'}
function draw(){X.save();if(shake)X.translate(R(-shake,shake),R(-shake,shake));if(state===S.MENU){bgAquatic();X.fillStyle='#06151aaa';X.fillRect(0,0,W,H);center('#ff7047',"THE NEWT'S",H*.29,clamp(W/15,38,76));center('#f5e9c9','JOURNEY',H*.4,clamp(W/10,54,104));center('#cfe7de','A tiny life. A toxic refusal to die.',H*.49,18);center('#fff4d6','Press SPACE or tap ACTION',H*.62,22);center('#9ebbb5','Move: arrows / WASD  •  Action: Space  •  Toxin Burst: Shift',H*.7,14)}
 else if(state===S.EGG){bgAquatic();X.fillStyle='#3b7047';X.beginPath();X.ellipse(W*.5,H*.62,250,52,-.1,0,7);X.fill();X.strokeStyle='#e9f3c9aa';X.fillStyle='#d9efc077';X.lineWidth=5;X.beginPath();X.ellipse(player.x,player.y,64,82,0,0,7);X.fill();X.stroke();X.fillStyle='#e46347';X.beginPath();X.ellipse(player.x+Math.sin(t*3)*8,player.y,17,32,.4,0,7);X.fill();entities.forEach(entity);hud('I · THE EGG','Tap ACTION rapidly. Catch yolk nutrients.');meter('HATCH',player.hatch,100,H-54)}
 else if(state===S.LARVA){bgAquatic();entities.forEach(entity);drawLarva();hud('II · AQUATIC LARVA','Survive the pond • Midges feed • Blue orbs reveal');progress(stageTime,48)}
 else if(state===S.EFT){bgForest();entities.forEach(entity);drawNewt(player.x,player.y,1,false,player.camouflage?0.28:1);hud('III · THE EFT','Cross the forest • Dew slides • Moss conceals');progress(stageTime,48)}
 else if(state===S.BOSS){bgForest();entities.forEach(entity);drawNewt(player.x,player.y,1.25,true);hud('IV · ADULT NEWT',`Strike the exposed belly • R regenerates${player.regen>0?' in '+Math.ceil(player.regen)+'s':''}`);let b=entities.find(e=>e.type==='boss');if(b)meter('BULLFROG',b.hp,b.max,H-54)}
 else{bgForest();X.fillStyle='#051719bb';X.fillRect(0,0,W,H);center(state===S.VICTORY?'#ff7a4f':'#d2d5c9',state===S.VICTORY?'SURVIVOR':'RETURNED TO THE POND',H*.37,clamp(W/14,36,76));center('#f7edd4',state===S.VICTORY?'Egg. Larva. Eft. Adult. Still here.':'Evolution is spectacularly unsentimental.',H*.49,18);center('#fff','Press SPACE or tap ACTION to begin again',H*.63,20)}
 particles.forEach(p=>{X.globalAlpha=clamp(p.life/p.max,0,1);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill()});X.globalAlpha=1;if(player.power>0&&state!==S.EGG){X.strokeStyle='#ff754c88';X.lineWidth=8;X.beginPath();X.arc(player.x,player.y,80+Math.sin(t*8)*8,0,7);X.stroke()}if(messages.length){X.fillStyle='#071a20dd';round(W/2-190,H*.18,380,42,21);X.fill();center('#fff4d9',messages[0].s,H*.18+27,14)}X.restore()}
function meter(label,v,max,y){let w=Math.min(520,W-40),x=(W-w)/2;X.fillStyle='#071a20cc';round(x,y,w,28,14);X.fill();X.fillStyle='#ff7249';round(x+4,y+4,(w-8)*clamp(v/max,0,1),20,10);X.fill();center('#fff',`${label}  ${Math.ceil(v/max*100)}%`,y+19,12)}
function progress(v,max){let w=Math.min(360,W*.42);X.fillStyle='#fff5';X.fillRect(W-w-24,24,w,4);X.fillStyle='#fff';X.fillRect(W-w-24,24,w*clamp(v/max,0,1),4)}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
